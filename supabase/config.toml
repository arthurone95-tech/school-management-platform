# Supabase CLI configuration.
#
# This file is the standard `supabase init` output with the local project id
# set and defaults reflecting this repo's choices:
#   - Auth public sign-up is disabled (matching the remote dev project and the
#     sign-up guard in migrations/20261011000002_portal_signup_guard.sql).
#   - The URL/redirect values here apply to a local `supabase start` stack,
#     which is NOT part of this repo's migration workflow (no Docker); they are
#     kept only because the CLI expects the keys. The remote project's Site URL
#     and redirect allow-list are configured in the Supabase dashboard.
#
# Migration workflow (on this workstation invoke the CLI as `npx supabase@latest`;
# a cached bare `npx supabase` resolved a package missing the win32-x64 binary):
#   npx supabase@latest login              # scoped access token (or interactive)
#   npx supabase@latest link --project-ref ysjumhlyqhoobywgqand   # prompts for the
#                                       # project database password
#   npx supabase@latest db push --linked --dry-run   # safe check first
#   npx supabase@latest db push --linked             # applies only missing migrations
#
# `db push` reads supabase_migrations.schema_migrations, so the migrations already
# applied via the Management API and recorded there are skipped, not re-run
# (verified 2026-10-15: remote history matched the then-local migration files;
# 20261015000004_staff_invitations.sql was afterwards applied through the same
# Management-API path and recorded, so a dry-run now lists nothing to apply).
#
# Until the database password is available, new migrations are applied with the
# committed helper `node tests/live/apply-migration.mjs` against the dev
# project (see supabase/README.md). Keep this repo's config under version
# control; never commit `supabase/.temp/` (linked project state) or any
# credentials.

project_id = "school-management-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/**"]
jwt_expiry = 3600
enable_signup = false